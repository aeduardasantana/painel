<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1220">
  <title>Página não encontrada | Compass Rose Systems</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--text:#f4f7fb;--muted:#a8b4c7;--accent:#67dbc6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 24%,#19354a 0%,var(--bg) 58%);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
    main{width:min(100% - 40px,700px);text-align:center;padding:60px 0}
    .mark{display:inline-grid;place-items:center;width:68px;height:68px;border:1px solid #456174;border-radius:20px;color:var(--accent);font-size:35px;margin-bottom:24px}
    .code{font-size:clamp(88px,18vw,154px);letter-spacing:-.09em;line-height:1;font-weight:800;margin:0 15px 18px 0;color:var(--accent)}
    h1{font-size:clamp(25px,5vw,38px);line-height:1.2;margin:0 0 16px}
    p{color:var(--muted);max-width:510px;margin:0 auto 32px}
    a.action{display:inline-block;padding:13px 25px;color:#061b22;background:var(--accent);font-weight:700;text-decoration:none;border-radius:12px;transition:filter .2s}
    a.action:hover,a.action:focus-visible{filter:brightness(1.13)}
    footer{margin-top:64px;color:var(--muted);font-size:13px;letter-spacing:.04em}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✧</div>
    <div class="code" aria-label="Erro 404">404</div>
    <h1>Esta página saiu da rota.</h1>
    <p>O endereço pode ter sido alterado ou não estar disponível. Retorne ao início do Painel Compass Rose Systems para continuar sua navegação.</p>
    <a class="action" href="/">Voltar ao início</a>
    <footer>COMPASS ROSE SYSTEMS · TECNOLOGIA COM DIREÇÃO</footer>
  </main>
</body>
</html>
