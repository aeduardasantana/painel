name: Publicar módulos Meu Site na Locaweb
on:
  push:
    branches: [main]
    paths:
      - 'admsite/**'
      - 'sistemas/**'
      - 'busca-comercial/**'
      - 'portfolios/**'
      - '.github/workflows/deploy-solucoes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sistemas/**'
      - '.github/workflows/deploy-solucoes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: locaweb-painel-solucoes
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout e checagem de sintaxe
        uses: actions/checkout@v4
      - name: Validar gateways protegidos e páginas de cada braço
        run: |
          set -euo pipefail
          for f in sistemas/portal.php sistemas/pop.php sistemas/rotinas.php sistemas/rotinas-versao.php sistemas/rotinas-catalogo.php sistemas/rotinas-recorrencias.php sistemas/rotinas-desempenho.php sistemas/rotinas-push-common.php sistemas/rotinas-push.php sistemas/rotinas-status.php sistemas/rotinas-disparar.php portfolios/_core.php portfolios/index.php portfolios/ecoar/index.php portfolios/geb-empresarial/index.php portfolios/geb-inclusao/index.php portfolios/geb-educacao/index.php; do
            php -l "$f"
          done
          grep -q 'GEB_PORTAL_SESSION_V2' sistemas/portal.php
          grep -q 'GEB_PORTAL_SESSION_V2' sistemas/pop.php
          grep -q 'GEB_PORTAL_SESSION_V2' sistemas/rotinas.php
          grep -Fq '<FilesMatch "^\.rotinas-(?:gestao|vapid|subs|sent)\.json$">' sistemas/.htaccess
          grep -q 'GEB_PORTAL_SESSION_V2' portfolios/_core.php
          grep -q 'DirectoryIndex index.php' portfolios/.htaccess
          grep -q 'Require all denied' portfolios/.htaccess
          test ! -f portfolios/index.html
          test -f sistemas/rotinas-app.js && node --check sistemas/rotinas-app.js
          test -f sistemas/rotinas-update.js && node --check sistemas/rotinas-update.js
          grep -q 'app-update-check' sistemas/rotinas.php
          grep -q 'app-update-banner' sistemas/rotinas-desempenho.php
          php -r 'require "sistemas/rotinas-versao.php"; if(pm_build_version()!=="") exit(1);'
          test -f sistemas/rotinas-sw.js && node --check sistemas/rotinas-sw.js
          python3 -m json.tool sistemas/rotinas.webmanifest >/dev/null
          python3 -m json.tool sistemas/composer.json >/dev/null
          test -f sistemas/vendor/.htaccess
          grep -q "geb-blog-conferir-publicacao" sistemas/rotinas-catalogo.php
          grep -q "saude-qua-1430-quinzenal" sistemas/rotinas-catalogo.php
          grep -q "pinterest-planejar-agendar-mes" sistemas/rotinas-catalogo.php
          grep -q "eduarda-bispo-gravar-conteudo-mensal" sistemas/rotinas-catalogo.php
          grep -q "eduarda-bispo-agendar-conteudo-mensal" sistemas/rotinas-catalogo.php
          php -r 'require "sistemas/rotinas-recorrencias.php"; $tasks=require "sistemas/rotinas-catalogo.php"; $tz=new DateTimeZone("America/Sao_Paulo"); $d=fn($x)=>new DateTimeImmutable($x,$tz); foreach(["eduarda-bispo-gravar-conteudo-mensal","eduarda-bispo-agendar-conteudo-mensal"] as $id){$t=$tasks[$id];if(!pm_scheduled($t,$d("2026-11-12")) || pm_scheduled($t,$d("2026-11-13")) || !pm_scheduled($t,$d("2026-12-12")) || pm_scheduled($t,$d("2026-12-13"))) exit(1);}'
          grep -Fq "['feito','pendente','cancelado','limpar']" sistemas/rotinas.php
          grep -q 'value="cancelado"' sistemas/rotinas.php
          grep -q "task.status==='cancelado'" sistemas/rotinas-app.js
          grep -Fq "['feito','cancelado']" sistemas/rotinas-disparar.php
          grep -q "'cancelado'=>0" sistemas/rotinas-desempenho.php
          grep -q "educacao-bolsa-mais-brasil-agendar" sistemas/rotinas-catalogo.php
          php -r 'require "sistemas/rotinas-recorrencias.php"; $a=require "sistemas/rotinas-catalogo.php"; $t=$a["educacao-bolsa-mais-brasil-agendar"]; $d=fn($s)=>new DateTimeImmutable($s,new DateTimeZone("America/Sao_Paulo")); if (!pm_scheduled($t,$d("2026-11-11")) || pm_scheduled($t,$d("2026-11-12")) || !pm_scheduled($t,$d("2026-12-11")) || pm_scheduled($t,$d("2027-01-11")) || !pm_scheduled($t,$d("2027-01-10"))) exit(1);'
          grep -q "studio.youtube.com/channel/UCanvdpcTbEXJa4xXeeHjbig/content" sistemas/rotinas-catalogo.php
          php -r 'require "sistemas/rotinas-recorrencias.php"; $c=require "sistemas/rotinas-catalogo.php"; $tz=new DateTimeZone("America/Sao_Paulo"); $f=fn($s)=>new DateTimeImmutable($s,$tz); if (!pm_scheduled($c["saude-qua-1430-quinzenal"],$f("2026-11-11")) || pm_scheduled($c["saude-qua-1430-quinzenal"],$f("2026-11-18")) || !pm_scheduled($c["saude-qua-1430-quinzenal"],$f("2026-11-25")) || !pm_scheduled($c["pinterest-planejar-agendar-mes"],$f("2026-11-20")) || pm_scheduled($c["pinterest-planejar-agendar-mes"],$f("2026-11-21")))exit(1);'
          for id in geb-educacao-curadoria-mensal-bolsas geb-educacao-revisao-editorial-youtube geb-educacao-videos-mensais geb-educacao-automacao-espelho-bio; do grep -q "$id" sistemas/rotinas-catalogo.php; done
          php -r 'require "sistemas/rotinas-recorrencias.php"; $c=require "sistemas/rotinas-catalogo.php"; $tz=new DateTimeZone("America/Sao_Paulo"); $f=fn($s)=>new DateTimeImmutable($s,$tz); foreach(["geb-educacao-curadoria-mensal-bolsas","geb-educacao-videos-mensais"] as $id){if(!pm_scheduled($c[$id],$f("2026-11-13")) || pm_scheduled($c[$id],$f("2026-11-14")) || !pm_scheduled($c[$id],$f("2026-12-13")))exit(1);} foreach(["geb-educacao-revisao-editorial-youtube","geb-educacao-automacao-espelho-bio"] as $id){if(!pm_scheduled($c[$id],$f("2026-11-13")) || pm_scheduled($c[$id],$f("2026-11-14")) || pm_scheduled($c[$id],$f("2026-12-13")))exit(1);}'
          test -f .github/workflows/alertas-rotinas.yml
          php -r 'require "sistemas/rotinas-recorrencias.php"; $r=require "sistemas/rotinas-catalogo.php"; $d=new DateTimeImmutable("2026-11-15",new DateTimeZone("America/Sao_Paulo")); $a=array_filter($r,fn($t)=>pm_scheduled($t,$d)); if(count($a)!==1 || !isset($a["geb-blog-conferir-publicacao"]))exit(1);'
      - name: Validar dependências PHP de notificações
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: curl, mbstring, openssl
          tools: composer:v2
      - name: Testar instalação da biblioteca Web Push
        run: |
          composer install --working-dir=sistemas --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          test -f sistemas/vendor/autoload.php
          test -f sistemas/vendor/.htaccess
  deploy:
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar secrets de FTP
        env:
          FTP_HOST: ${{ secrets.HOST || secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.USER || secrets.LOCAWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.PASS || secrets.LOCAWEB_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS" || {
            echo "::error::Configure HOST, USER e PASS nos secrets."
            exit 1
          }
      - name: Preparar PHP para instalar a biblioteca Web Push
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: curl, mbstring, openssl
          tools: composer:v2
      - name: Instalar dependências Web Push
        run: |
          composer install --working-dir=sistemas --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          test -f sistemas/vendor/autoload.php
          test -f sistemas/vendor/.htaccess
      - name: Gerar ícones para instalação PC e celular
        run: |
          python3 sistemas/gerar-icones.py
          file sistemas/rotinas-icon-192.png sistemas/rotinas-icon-512.png
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Publicar somente os novos módulos
        env:
          FTP_HOST: ${{ secrets.HOST || secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.USER || secrets.LOCAWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.PASS || secrets.LOCAWEB_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set net:max-retries 3
          set net:timeout 20
          set ftp:ssl-allow false
          cd public_html/painel
          rm -f meusite/index.html
          mirror -R --only-newer admsite admsite
          # Proteção do diretório antes de transferir dados ou dependências.
          put sistemas/.htaccess -o sistemas/.htaccess
          mirror -R --only-newer sistemas sistemas
          mirror -R --only-newer busca-comercial busca-comercial
          # Bloquear imediatamente o HTML legado público, antes de subir páginas PHP.
          put portfolios/.htaccess -o portfolios/.htaccess
          rm -f portfolios/index.html
          mirror -R --only-newer portfolios portfolios
          rm -f l/index.html
          bye
          EOF

      - name: Registrar a versão somente após transferência completa
        env:
          FTP_HOST: ${{ secrets.HOST || secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.USER || secrets.LOCAWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.PASS || secrets.LOCAWEB_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > /tmp/rotinas-version.json
          python3 -m json.tool /tmp/rotinas-version.json > /dev/null
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set net:max-retries 3
          set net:timeout 20
          set ftp:ssl-allow false
          cd public_html/painel/sistemas
          put /tmp/rotinas-version.json -o rotinas-version.json
          bye
          EOF

      - name: Marcar apenas a revisão editorial aprovada como Feito
        shell: bash
        env:
          ROTINAS_JOB_KEY: ${{ secrets.SYSTEMS_PASS }}
          FTP_HOST: ${{ secrets.HOST || secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.USER || secrets.LOCAWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.PASS || secrets.LOCAWEB_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          uploaded=1
          cleanup_endpoint() {
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'END_FTP_CLEANUP'
          set net:max-retries 3
          set net:timeout 20
          set ftp:ssl-allow false
          cd public_html/painel/sistemas
          rm -f rotinas-aprovacao-geb-20261113-once.php
          bye
          END_FTP_CLEANUP
          }
          trap cleanup_endpoint EXIT
          cat > /tmp/rotinas-aprovacao-geb-20261113-once.php <<'END_APPROVAL_PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/rotinas-push-common.php';
          rp_jsonHeaders();
          header('X-Robots-Tag: noindex,nofollow');
          if (($_SERVER['REQUEST_METHOD'] ?? '') !== 'POST' || empty($_SERVER['HTTPS']) || $_SERVER['HTTPS']==='off') {
              rp_fail(403,'Acesso não autorizado.');
          }
          $provided=(string)($_SERVER['HTTP_X_ROTINAS_JOB_KEY']??'');
          $hash=getenv('SYSTEMS_PASS_HASH');
          if (!$hash && is_file(__DIR__.'/.systems-pass.php')) {
              $candidate=require __DIR__.'/.systems-pass.php';
              if (is_string($candidate)) $hash=$candidate;
          }
          if (!$hash && is_file(dirname(__DIR__,3).'/.geb-systems-auth.php')) {
              $candidate=require dirname(__DIR__,3).'/.geb-systems-auth.php';
              if (is_string($candidate)) $hash=$candidate;
          }
          if (!is_string($hash) || !password_get_info($hash)['algo'] || $provided==='' || strlen($provided)>250 || !password_verify($provided,$hash)) {
              rp_fail(403,'Acesso não autorizado.');
          }
          require __DIR__.'/rotinas-recorrencias.php';
          $tasks=require __DIR__.'/rotinas-catalogo.php';
          $id='geb-educacao-revisao-editorial-youtube';
          $key='2026-11-13';
          $tz=new DateTimeZone('America/Sao_Paulo');
          $date=new DateTimeImmutable('2026-11-13',$tz);
          if (!isset($tasks[$id]) || !pm_scheduled($tasks[$id],$date)) {
              rp_fail(503,'Tarefa editorial não cadastrada para a data.');
          }
          $alreadyDone=false;
          try {
              rp_mutate('.rotinas-gestao.json',function(array $records) use($key,$id,$tz,&$alreadyDone):array {
                  $alreadyDone=(($records[$key][$id]['status']??'')==='feito');
                  if (!$alreadyDone) {
                      $records[$key][$id]=[
                          'status'=>'feito',
                          'alterado_em'=>(new DateTimeImmutable('now',$tz))->format(DATE_ATOM),
                          'fundamento'=>'Matriz editorial e piloto de 30 dias aprovados explicitamente pela direcao do GEB Educacao em 12/11/2026.',
                          'documento'=>'https://docs.google.com/document/d/1Lmr6JgOQAyqYQyOM94c4Wb9kqfMyy-0SabW3QB5ThsE/edit'
                      ];
                  }
                  return $records;
              });
              $recorded=rp_data('.rotinas-gestao.json');
              if (($recorded[$key][$id]['status']??'')!=='feito') rp_fail(503,'A conclusão não foi confirmada.');
          } catch(Throwable $e) {
              rp_fail(503,'Não foi possível registrar a conclusão da decisão editorial.');
          }
          echo json_encode(['ok'=>true,'date'=>$key,'task'=>$id,'status'=>'feito','already_done'=>$alreadyDone],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          END_APPROVAL_PHP
          php -l /tmp/rotinas-aprovacao-geb-20261113-once.php
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'END_FTP_UPLOAD'
          set net:max-retries 3
          set net:timeout 20
          set ftp:ssl-allow false
          cd public_html/painel/sistemas
          put /tmp/rotinas-aprovacao-geb-20261113-once.php -o rotinas-aprovacao-geb-20261113-once.php
          bye
          END_FTP_UPLOAD
          response="$(curl --fail-with-body --silent --show-error --max-time 45 --retry 2 --retry-delay 3 --request POST --header "X-Rotinas-Job-Key: $ROTINAS_JOB_KEY" --header "Accept: application/json" "https://painel.compassrosesystems.com.br/sistemas/rotinas-aprovacao-geb-20261113-once.php")"
          printf '%s\n' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("task")=="geb-educacao-revisao-editorial-youtube" and d.get("date")=="2026-11-13" and d.get("status")=="feito", d; print("Conferido no servidor: revisão editorial Feito; outras tarefas não alteradas.")'
          

      - name: Fiscalizar acesso externo sem senha
        shell: bash
        run: |
          set -euo pipefail
          origin="https://painel.compassrosesystems.com.br"
          expect_redirect() {
            local path="$1" code
            code=$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$origin$path")
            echo "$path -> HTTP $code"
            if [ "$code" != "302" ]; then
              echo "::error::Rota protegida retornou $code, deveria exigir login (302): $path"
              exit 1
            fi
          }
          expect_forbidden() {
            local path="$1" code
            code=$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$origin$path")
            echo "$path -> HTTP $code"
            if [ "$code" != "403" ] && [ "$code" != "404" ]; then
              echo "::error::Arquivo protegido retornou $code, deveria ser bloqueado: $path"
              exit 1
            fi
          }
          expect_redirect "/portfolios/"
          expect_redirect "/portfolios/ecoar/"
          expect_redirect "/portfolios/geb-empresarial/"
          expect_redirect "/portfolios/geb-inclusao/"
          expect_redirect "/portfolios/geb-educacao/"
          expect_redirect "/sistemas/pop.php"
          expect_redirect "/sistemas/rotinas.php"
          expect_redirect "/sistemas/rotinas-desempenho.php"
          expect_forbidden "/sistemas/.rotinas-gestao.json"
          expect_forbidden "/sistemas/.rotinas-subs.json"
          expect_forbidden "/sistemas/.rotinas-vapid.json"
          expect_forbidden "/sistemas/.rotinas-sent.json"
          expect_forbidden "/sistemas/vendor/autoload.php"
          for path in rotinas-app.js rotinas-update.js rotinas-version.json rotinas-sw.js rotinas.webmanifest rotinas-icon.svg rotinas-icon-192.png rotinas-icon-512.png; do
            code=$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$origin/sistemas/$path")
            echo "/sistemas/$path -> HTTP $code"
            test "$code" = "200"
          done
          published="$(curl --fail --silent --show-error --max-time 25 "$origin/sistemas/rotinas-version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')"
          test "$published" = "$GITHUB_SHA" || {
            echo "::error::Versão publicada não corresponde ao commit implantado."
            exit 1
          }
          for path in rotinas-push.php rotinas-status.php; do
            code=$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$origin/sistemas/$path")
            echo "/sistemas/$path sem login -> HTTP $code"
            test "$code" = "401"
          done
          code=$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$origin/sistemas/rotinas-disparar.php")
          test "$code" = "403"
          expect_forbidden "/portfolios/index.html"
          expect_forbidden "/portfolios/_core.php"

