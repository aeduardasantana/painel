name: Publicar módulos Meu Site na Locaweb
on:
  push:
    branches: [main]
    paths:
      - 'admsite/**'
      - 'sistemas/**'
      - 'busca-comercial/**'
      - 'portfolios/**'
      - '.github/workflows/deploy-solucoes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: locaweb-painel-solucoes
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout e checagem de sintaxe
        uses: actions/checkout@v4
      - name: Validar gateways protegidos e páginas de cada braço
        run: |
          set -euo pipefail
          for f in sistemas/portal.php sistemas/pop.php portfolios/_core.php portfolios/index.php portfolios/ecoar/index.php portfolios/geb-empresarial/index.php; do
            php -l "$f"
          done
          grep -q 'GEB_PORTAL_SESSION_V2' sistemas/portal.php
          grep -q 'GEB_PORTAL_SESSION_V2' sistemas/pop.php
          grep -q 'GEB_PORTAL_SESSION_V2' portfolios/_core.php
          grep -q 'DirectoryIndex index.php' portfolios/.htaccess
          grep -q 'Require all denied' portfolios/.htaccess
          test ! -f portfolios/index.html
  deploy:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar secrets de FTP
        env:
          FTP_HOST: ${{ secrets.HOST || secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.USER || secrets.LOCAWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.PASS || secrets.LOCAWEB_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS" || {
            echo "::error::Configure HOST, USER e PASS nos secrets."
            exit 1
          }
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Publicar somente os novos módulos
        env:
          FTP_HOST: ${{ secrets.HOST || secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.USER || secrets.LOCAWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.PASS || secrets.LOCAWEB_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set net:max-retries 3
          set net:timeout 20
          set ftp:ssl-allow false
          cd public_html/painel
          rm -f meusite/index.html
          mirror -R --only-newer admsite admsite
          mirror -R --only-newer sistemas sistemas
          mirror -R --only-newer busca-comercial busca-comercial
          # Bloquear imediatamente o HTML legado público, antes de subir páginas PHP.
          put portfolios/.htaccess -o portfolios/.htaccess
          rm -f portfolios/index.html
          mirror -R --only-newer portfolios portfolios
          rm -f l/index.html
          bye
          EOF
