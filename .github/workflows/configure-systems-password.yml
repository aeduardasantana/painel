name: Configure Portal password
on:
  workflow_dispatch:
jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      SYSTEMS_PASS: ${{ secrets.SYSTEMS_PASS }}
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_REMOTE_DIR: ${{ vars.PAINEL_FTP_PATH || './public_html/painel/sistemas' }}
    steps:
      - name: Verify required deployment secrets exist
        shell: bash
        run: |
          if [ -z "$SYSTEMS_PASS" ]; then echo "::error::Missing SYSTEMS_PASS secret"; exit 1; fi
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP credentials not found. Configure FTP_HOST/FTP_SERVER, FTP_USER/FTP_USERNAME and FTP_PASSWORD/FTP_PASS in Actions Secrets."
            exit 1
          fi
      - name: Create server-only password hash
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          php -r '$password=getenv("SYSTEMS_PASS"); if (!$password) exit(1); echo "<?php\nreturn ".var_export(password_hash($password,PASSWORD_DEFAULT),true).";\n";' > .systems-pass.php
      - name: Upload protected config to Locaweb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<EOF
          set ftp:ssl-allow true
          set ssl:verify-certificate true
          set net:max-retries 2
          cd $FTP_REMOTE_DIR
          put .systems-pass.php -o .systems-pass.php
          bye
          EOF
      - name: Remove generated secret material
        if: always()
        run: rm -f .systems-pass.php
